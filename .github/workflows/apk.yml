name: Build APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build hev tunnel libraries
        run: NDK_DEBUG=0 bash compile-hevtun.sh

      - name: Copy hev libraries
        run: cp -a libs V2rayNG/app/

      - name: Download libv2ray
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          SUB="$ROOT/AndroidLibXrayLite"
          git submodule update --init --recursive --depth 1 AndroidLibXrayLite
          TOP="$(git -C "$SUB" rev-parse --show-toplevel)"
          if [ "$TOP" = "$ROOT" ]; then
            echo "AndroidLibXrayLite submodule checkout is missing"
            exit 1
          fi
          git -C "$SUB" fetch --tags --force
          TAG="$(git -C "$SUB" describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            TAG="$(git -C "$SUB" tag --list 'v2[0-9].*' --sort=-v:refname | head -1)"
          fi
          if [ -z "$TAG" ]; then
            TAG="v26.10.31"
          fi
          echo "libv2ray tag: $TAG"
          mkdir -p V2rayNG/app/libs
          URL="https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar"
          echo "Downloading $URL"
          curl -fL --retry 10 --retry-all-errors --retry-delay 5 \
            -o V2rayNG/app/libs/libv2ray.aar \
            "$URL"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prefetch Gradle distribution
        working-directory: V2rayNG
        run: |
          set -euo pipefail
          chmod 755 gradlew
          TMP_ZIP="${RUNNER_TEMP}/gradle-9.8.2-bin.zip"
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Gradle bootstrap attempt ${attempt}"
            rm -f "$TMP_ZIP" || true
            if curl -fL --retry 8 --retry-all-errors --retry-delay 5 \
              -o "$TMP_ZIP" \
              "https://services.gradle.org/distributions/gradle-9.8.2-bin.zip"; then
              # Point the wrapper at the local zip so Java URLConnection 504 is avoided.
              sed -i "s|^distributionUrl=.*|distributionUrl=file\\:${TMP_ZIP}|" \
                gradle/wrapper/gradle-wrapper.properties
              if ./gradlew --version; then
                exit 0
              fi
            fi
            sleep $((attempt * 8))
          done
          echo "Failed to download Gradle after retries"
          exit 1

      - name: Build release APK
        working-directory: V2rayNG
        env:
          STORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Release signing secrets are missing."
            exit 1
          fi
          echo "$STORE_B64" | base64 -d > "$RUNNER_TEMP/barani-release.p12"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/barani-release.p12" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.store.type=pkcs12 \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: barani-universal
          path: V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle.kts | head -1)"
          NOTES_FILE="release-notes.txt"
          if [ ! -f "$NOTES_FILE" ]; then
            printf 'Barani Core %s\n' "$VER" > "$NOTES_FILE"
          fi
          APK="$(ls V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk)"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "$APK" --clobber
            gh release edit "v$VER" --title "Barani Core $VER" --notes-file "$NOTES_FILE"
          else
            gh release create "v$VER" "$APK" \
              --title "Barani Core $VER" \
              --notes-file "$NOTES_FILE"
          fi
          gh release delete apk --yes --cleanup-tag || true
